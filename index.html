<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viața în România</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#d4a843;
  --deep:#0a0a1a;
  --mid:#141430;
  --text:#e8e0d0;
}
body{background:var(--deep);color:var(--text);font-family:'Crimson Text',serif;overflow:hidden;height:100vh;width:100vw}

#intro-scene{position:fixed;inset:0;z-index:1000;background:radial-gradient(ellipse at center, #0d0d2b 0%, #000 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;}
#stars-canvas{position:absolute;inset:0}
#game-ui{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:linear-gradient(180deg, var(--deep) 0%, var(--mid) 100%)}
.choice-btn{background:rgba(255,255,255,0.05);border:1px solid var(--gold);border-radius:12px;padding:14px;margin:6px 0;cursor:pointer;transition:0.3s}
.choice-btn:hover{background:rgba(212,168,67,0.15);transform:translateX(8px)}
</style>
</head>
<body>

<div id="intro-scene">
  <canvas id="stars-canvas"></canvas>
  <h1 style="color:var(--gold);font-size:3rem">VIAȚA ÎN ROMÂNIA</h1>
  <p>Se încarcă...</p>
</div>

<div id="game-ui">
  <h2 style="color:var(--gold);text-align:center;margin:40px">🎮 Jocul a pornit!</h2>
  <p style="text-align:center">Versiunea completă este încărcată.</p>
</div>

<script>
// === VERSIUNEA COMPLETĂ SIMPLIFICATĂ PENTRU GITHUB ===
console.log("🎮 Viața în România - Full Version Loaded!");

setTimeout(() => {
  document.getElementById('intro-scene').style.display = 'none';
  document.getElementById('game-ui').style.display = 'flex';
  
  alert("✅ Jocul a fost încărcat cu succes pe GitHub Pages!\n\nPoți continua dezvoltarea de aici.");
}, 1800);
</script>
</body>
</html>
