<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viața în România</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#0a0a1a;
            color:#e8e0d0;
            font-family:'Crimson Text',serif;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            text-align:center;
        }
        h1{color:#d4a843; font-size:3.5rem;}
    </style>
</head>
<body>
    <h1>🎮 VIAȚA ÎN ROMÂNIA</h1>
    <p style="font-size:1.4rem; margin:20px 0;">Jocul se încarcă...</p>

    <script>
        console.log("✅ Jocul s-a încărcat cu succes pe GitHub!");
        
        setTimeout(() => {
            document.body.innerHTML += `<br><br><strong style="color:#2ecc71">Totul funcționează!</strong>`;
        }, 1200);
    </script>
</body>
</html>
